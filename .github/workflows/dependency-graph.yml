# Resolves the Gradle dependency graph on every push to main and submits it.
# GitHub's own graph doesn't read libs.versions.toml, so without this neither
# Dependabot alerts nor Dependency Review see any Gradle dependencies.
#
# PRs don't get a pre-merge Gradle vulnerability review: GitHub takes 13 to
# 35+ minutes to show a submitted snapshot to the compare API, and fork PRs
# can't submit one without a separate workflow_run workflow. A vulnerable
# Gradle dependency shows up as a Dependabot alert once it lands on main.
# https://github.com/gradle/actions/blob/main/docs/dependency-submission.md
name: Dependency Graph

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep the job ID: it is part of the snapshot key (dependency_graph-generate).
  # GitHub keeps the latest snapshot per key, so a new ID would leave main's old
  # snapshot, and its alerts, in place forever.
  generate:
    name: Submit dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # POST /dependency-graph/snapshots

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: platform-tools

    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        # The default also uploads the graph as an artifact, which nothing reads.
        dependency-graph: generate-and-submit
