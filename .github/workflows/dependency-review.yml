# Fails a PR that adds a dependency with a known high/critical vulnerability.
# Waits for dependency-graph.yml + dependency-graph-submit.yml to submit the
# PR's Gradle snapshot, then diffs it against the base commit's.
#
# Not required for merging (and not in test.yml's `check` job) while it's new:
# it depends on two other workflows and on repo settings (Dependency graph), so
# a hiccup there would block every PR. Promote it once it has proven reliable.
# On a fork PR it's only a safety net for honest mistakes: the PR controls the
# build that produces its own graph.
name: Dependency Review

on:
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        # The Gradle plugin submits no scopes, so GitHub reports them as
        # `unknown`; with the default (`runtime`) nothing could ever fail.
        fail-on-scopes: runtime, unknown
        # License policy is a separate decision; vulnerabilities only for now.
        license-check: false
        # Fork PRs can't get `pull-requests: write`, so no PR comment; the
        # result is in the job summary.
        comment-summary-in-pr: never
        # Poll until the PR's Gradle snapshot lands (generate + submit runs).
        retry-on-snapshot-warnings: true
        # Generate (15 min) + submit (5 min) timeouts, plus queueing slack.
        retry-on-snapshot-warnings-timeout: 1200

    # The action passes even if the snapshot never arrived (it just warns), which
    # would let a new vulnerable Gradle dependency through on a green check.
    - name: Fail if the PR's Gradle snapshot is still missing
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        warnings=$(gh api -i "repos/$REPO/dependency-graph/compare/$BASE_SHA...$HEAD_SHA" \
          | tr -d '\r' \
          | awk 'tolower($0) ~ /^x-github-dependency-graph-snapshot-warnings:/ {sub(/^[^:]*:[ ]*/, ""); print}')
        if [[ -n "$warnings" ]]; then
          echo "::error::Dependency graph snapshot warnings remain: $warnings"; exit 1
        fi
