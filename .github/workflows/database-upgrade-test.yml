name: Database Upgrade Test

# Upgrades an old database on API 26, our minSdk and so our oldest SQLite (3.18).
# Newer SQLite accepts syntax old phones reject: a 2.22.0 migration crashed every
# launch on Android <=13 while every other test passed (#922).

on:
  push:
    branches: [ main ]
    paths:
    - 'app/schemas/**'
    - 'app/src/main/java/com/pennywiseai/tracker/data/database/**'
    - 'app/src/androidTest/java/com/pennywiseai/tracker/data/database/**'
    - 'app/build.gradle.kts'
    - 'gradle/libs.versions.toml'
    - '.github/workflows/database-upgrade-test.yml'
  pull_request:
    branches: [ main ]
    paths:
    - 'app/schemas/**'
    - 'app/src/main/java/com/pennywiseai/tracker/data/database/**'
    - 'app/src/androidTest/java/com/pennywiseai/tracker/data/database/**'
    - 'app/build.gradle.kts'
    - 'gradle/libs.versions.toml'
    - '.github/workflows/database-upgrade-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

defaults:
  run:
    shell: bash

jobs:
  upgrade-test:
    name: Upgrade Test (API 26)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Gradle and the emulator runner fetch the rest.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@v5

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Cache AVD
      id: avd-cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.android/avd/*
          ~/.android/adb*
        key: avd-api26-google_apis-x86_64-pixel_2

    - name: Create AVD snapshot
      if: steps.avd-cache.outputs.cache-hit != 'true'
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        force-avd-creation: false
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: false
        script: echo "AVD snapshot created."

    # Standard flavor: fdroid's abiFilters are ARM-only, so it can't install on
    # this x86_64 emulator.
    - name: Run upgrade test
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        force-avd-creation: false
        emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: ./gradlew :app:connectedStandardDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pennywiseai.tracker.data.database.FullUpgradeTest --build-cache

    - name: Upload test reports
      uses: actions/upload-artifact@v7
      if: failure()
      with:
        name: upgrade-test-reports
        path: |
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
        retention-days: 7
