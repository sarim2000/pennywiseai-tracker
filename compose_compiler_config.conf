// Types the Compose compiler can't see are immutable. Listed here, entities made of them
// (TransactionEntity's BigDecimal amount and LocalDateTime) become stable, so a row skips
// recomposition when Room re-emits an equal row instead of redrawing every visible one.
// Only add a type here if it is truly immutable.
java.math.BigDecimal
java.math.BigInteger
java.time.*
java.util.Locale
