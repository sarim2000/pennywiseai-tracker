name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

defaults:
  run:
    shell: bash

jobs:
  parser-tests:
    name: Parser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Run parser-core tests
      run: ./gradlew :parser-core:test --continue

    - name: Upload parser test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: parser-test-results
        path: parser-core/build/test-results/test/
        retention-days: 7

  app-compile:
    name: App Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Compile standard debug app
      run: ./gradlew :app:compileStandardDebugKotlin --build-cache

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --build-cache

    - name: Upload standard debug APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: standard-debug-apk
        path: app/build/outputs/apk/standard/debug/*.apk
        retention-days: 7

    - name: Upload fdroid debug APK
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: fdroid-debug-apk
        path: app/build/outputs/apk/fdroid/debug/*.apk
        retention-days: 7

    - name: Upload compile report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: compile-report
        path: app/build/reports/
        retention-days: 7

  app-unit-tests:
    name: App Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Run standard debug unit tests
      run: ./gradlew :app:testStandardDebugUnitTest :core:designsystem:testDebugUnitTest :feature:exchangerates:testDebugUnitTest --build-cache --continue

    - name: Upload test results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: app-test-results
        path: |
          app/build/test-results/
          core/designsystem/build/test-results/
          feature/exchangerates/build/test-results/
        retention-days: 7

  format-check:
    name: Format Check (advisory)
    # A push to main has nothing past origin/main to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory while the codebase is brought in line: a failure is reported
    # here but never fails the workflow. Fix locally with ./gradlew spotlessApply.
    # ponytail: ~480 of ~1230 Kotlin files still fail ktlint and the ratchet is
    # per file, so blocking now forces whole-file reformats on any touch. Drop
    # continue-on-error once the cleanup PRs land.
    continue-on-error: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Spotless checks only files changed since origin/main, which needs
        # main's history to find the merge base.
        fetch-depth: 0

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Check formatting of changed files
      run: ./gradlew spotlessCheck --continue

  # Branch protection should require this job instead of each job above.
  # Upgrade Test (API 26) stays a separate, path-filtered workflow: it runs only
  # on schema/database PRs, so it can't be required — check it on those PRs.
  check:
    name: Check
    needs: [parser-tests, app-compile, app-unit-tests, format-check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
    - name: Fail if any job failed or was cancelled
      if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
      run: exit 1
