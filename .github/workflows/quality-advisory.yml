name: Quality (advisory)

# Report-only: Detekt findings and unit-test coverage. Every job is continue-on-error and
# none is in the required Check job (test.yml), so nothing here blocks a merge.
# See docs/architecture.md#static-analysis-and-coverage.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
    - 'app/**'
    - 'core/**'
    - 'feature/**'
    - 'parser-core/**'
    - 'build-logic/**'
    - 'config/detekt/**'
    - 'gradle/libs.versions.toml'
    - '*.gradle.kts'
    - '.github/workflows/quality-advisory.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

defaults:
  run:
    shell: bash

jobs:
  detekt:
    name: Detekt (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    # The step may fail (new findings) without failing the job; the next step turns a
    # failure into a warning annotation and a summary line so it is not silently green.
    - name: Run Detekt against the baseline
      id: detekt
      continue-on-error: true
      run: |
        set -o pipefail
        ./gradlew detekt --build-cache 2>&1 | tee "$RUNNER_TEMP/detekt.log"

    - name: Summarise Detekt result
      if: always()
      env:
        DETEKT_OUTCOME: ${{ steps.detekt.outcome }}
      run: |
        report=build/reports/detekt/detekt.txt
        if [ "$DETEKT_OUTCOME" = "success" ]; then
          echo "Detekt: no findings beyond config/detekt/baseline.xml." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        weighted=$(grep -oE 'Analysis failed with [0-9]+ weighted issues?' "$RUNNER_TEMP/detekt.log" | grep -oE '[0-9]+' | head -n 1 || true)
        if [ -z "$weighted" ]; then
          echo "::warning title=Detekt (advisory)::Detekt did not finish ($DETEKT_OUTCOME); see the job log."
          echo "Detekt did not finish ($DETEKT_OUTCOME); see the job log." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        findings=0
        if [ -f "$report" ]; then
          findings=$(wc -l < "$report" | tr -d ' ')
        fi
        echo "::warning title=Detekt (advisory)::Detekt found $findings finding(s), $weighted weighted issue(s), not in config/detekt/baseline.xml. See the detekt-report artifact."
        {
          echo "### Detekt: $findings finding(s), $weighted weighted issue(s) not in the baseline"
          echo
          echo "Fix them, or replace stale IDs in config/detekt/baseline.xml when a baselined smell only moved."
          if [ -f "$report" ]; then
            echo
            echo '```'
            # One command reads the whole report: piping into head could SIGPIPE sed
            # and fail this step under pipefail.
            sed -n -e "s|$GITHUB_WORKSPACE/||" -e 's| - Signature=.*||' -e '1,50p' "$report"
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Detekt report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: detekt-report
        path: build/reports/detekt/
        retention-days: 7

  coverage:
    name: Coverage (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Unit tests with Kover reports
      run: >-
        ./gradlew -Pcoverage --build-cache --continue
        :app:koverXmlReportStandardDebug :app:koverHtmlReportStandardDebug
        :core:designsystem:koverXmlReportDebug :core:designsystem:koverHtmlReportDebug
        :feature:exchangerates:koverXmlReportDebug :feature:exchangerates:koverHtmlReportDebug
        :feature:learnedcategories:koverXmlReportDebug :feature:learnedcategories:koverHtmlReportDebug

    - name: Upload coverage reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: coverage-reports
        path: |
          app/build/reports/kover/
          core/designsystem/build/reports/kover/
          feature/exchangerates/build/reports/kover/
          feature/learnedcategories/build/reports/kover/
        retention-days: 7
