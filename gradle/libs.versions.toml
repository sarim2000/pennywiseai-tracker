[versions]
agp = "9.5.0"
appUpdate = "2.1.0"
biometric = "1.4.0-alpha07"
coreSplashscreen = "1.2.0"
datastorePreferences = "1.3.0"
documentfile = "1.1.0"
glance = "1.2.0"
hiltAndroid = "2.60.1"
androidxHilt = "1.4.0"
kotlin = "2.4.21"
ksp = "2.3.13"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
kotlinxSerializationJson = "1.12.0"
ktorVersion = "3.6.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
mockk = "1.14.11"
# Konsist bundles kotlin-compiler-embeddable: keep it on a release built against
# the project's Kotlin version (0.18.1 targets Kotlin 2.4.21).
konsist = "0.18.1"
# ktlint parses with its own embedded Kotlin compiler (1.8.0 ships 2.2.21), not the
# project's: after a Kotlin or ktlint bump, confirm it still parses every source.
ktlint = "1.8.0"
navigation3 = "1.2.0"
opencsv = "5.12.0"
pdfboxAndroid = "2.0.27.0"
review = "2.0.2"
roomVersion = "3.0.3"
# litertlm >= 0.14 is built with -Xjvm-default=all and calls
# SendChannel.close$default as an interface static, which kotlinx-coroutines
# only ships from 1.11.0 — keep coroutines >= 1.11.0 (#599). 0.17+ needs
# Kotlin 2.4 metadata (Hilt >= 2.60). 0.18+ hands the chat template message
# content as a list of parts, which the Qwen 2.5 model's own template can't
# read: chat passes QwenChatTemplate instead (LlmServiceImpl).
litertlm = "0.19.0"
coroutines = "1.11.0"
benchmark = "1.5.0"
uiautomator = "2.4.1"
profileinstaller = "1.4.1"
workVersion = "2.12.0"
coil = "3.6.3"
zxing = "3.5.4"
material3 = "1.5.0-rc01"
haze = "2.1.0"
composeCharts = "1.0.0"
billingKtx = "9.1.0"
leakcanary = "3.0-alpha-9"
spotless = "8.11.0"
dependencyAnalysis = "3.20.2"

[libraries]
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
