name: Database Upgrade Test

# Upgrades an old database on API 26, our minSdk and so our oldest SQLite (3.18).
# Newer SQLite accepts syntax old phones reject: a 2.22.0 migration crashed every
# launch on Android <=13 while every other test passed (#922).

on:
  push:
    branches: [ main ]
    paths:
    - 'app/schemas/**'
    - 'app/src/main/java/com/pennywiseai/tracker/data/database/**'
    - 'app/src/androidTest/java/com/pennywiseai/tracker/data/database/**'
    - 'app/build.gradle.kts'
    - 'gradle/libs.versions.toml'
    - '.github/workflows/database-upgrade-test.yml'
  pull_request:
    branches: [ main ]
    paths:
    - 'app/schemas/**'
    - 'app/src/main/java/com/pennywiseai/tracker/data/database/**'
    - 'app/src/androidTest/java/com/pennywiseai/tracker/data/database/**'
    - 'app/build.gradle.kts'
    - 'gradle/libs.versions.toml'
    - '.github/workflows/database-upgrade-test.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

defaults:
  run:
    shell: bash

jobs:
  upgrade-test:
    name: Upgrade Test (API 26)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Gradle and the emulator runner fetch the rest.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    # Standard flavor: fdroid's abiFilters are ARM-only, so it can't install on
    # this x86_64 emulator.
    # Cold boot every run: restored from a cached snapshot, this emulator died
    # right after booting in most runs (adb exit 137, or the device vanished).
    # A cold boot costs about 40s more.
    - name: Run upgrade test
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: 26
        target: google_apis
        arch: x86_64
        profile: pixel_2
        emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: ./gradlew :app:connectedStandardDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.pennywiseai.tracker.data.database.FullUpgradeTest --build-cache

    # A failed APK install still exits 0 and writes a results file with no tests.
    - name: Confirm the test ran
      run: grep -Eq 'testsuite name="com\.pennywiseai\.tracker\.data\.database\.FullUpgradeTest" tests="[1-9]' app/build/outputs/androidTest-results/connected/debug/flavors/standard/TEST-*.xml

    - name: Upload test reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: failure()
      with:
        name: upgrade-test-reports
        path: |
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
        retention-days: 7
