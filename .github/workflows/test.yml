name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true

defaults:
  run:
    shell: bash

jobs:
  parser-tests:
    name: Parser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@v5

    - name: Run parser-core tests
      run: ./gradlew :parser-core:test --continue

    - name: Upload parser test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: parser-test-results
        path: parser-core/build/test-results/test/
        retention-days: 7

  app-compile:
    name: App Compile
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@v5

    - name: Compile standard debug app
      run: ./gradlew :app:compileStandardDebugKotlin --build-cache

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --build-cache

    - name: Upload standard debug APK
      uses: actions/upload-artifact@v7
      with:
        name: standard-debug-apk
        path: app/build/outputs/apk/standard/debug/*.apk
        retention-days: 7

    - name: Upload fdroid debug APK
      uses: actions/upload-artifact@v7
      with:
        name: fdroid-debug-apk
        path: app/build/outputs/apk/fdroid/debug/*.apk
        retention-days: 7

    - name: Upload compile report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: compile-report
        path: app/build/reports/
        retention-days: 7

  app-unit-tests:
    name: App Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@v5

    - name: Run standard debug unit tests
      run: ./gradlew :app:testStandardDebugUnitTest :core:designsystem:testDebugUnitTest --build-cache --continue

    - name: Upload test results
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: app-test-results
        path: |
          app/build/test-results/
          core/designsystem/build/test-results/
        retention-days: 7

  format-check:
    name: Format Check (advisory)
    # A push to main has nothing past origin/main to check.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory while the codebase is brought in line: a failure is reported
    # here but never fails the workflow. Fix locally with ./gradlew spotlessApply.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v7
      with:
        # Spotless checks only files changed since origin/main, which needs
        # main's history to find the merge base.
        fetch-depth: 0

    - uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'

    - uses: android-actions/setup-android@v4
      with:
        # The action's default list includes the retired 'tools' package, which
        # sdkmanager now rejects (exit 1). Everything else is fetched by Gradle.
        packages: platform-tools

    - uses: gradle/actions/setup-gradle@v5

    - name: Check formatting of changed files
      run: ./gradlew spotlessCheck --continue